<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- 모바일 화면 대응 -->
    <meta name="viewport"
          content="width=device-width,
                   height=device-height,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>증강육목</title>

    <style>
        /* ================================
           전체 페이지 초기화
           ================================ */
        html, body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        /* ================================
           Unity 전체 컨테이너
           ================================ */
        #unity-container {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;

            /* 구형 브라우저용 */
            height: 100vh;

            /* 모바일 주소창까지 고려 */
            height: 100dvh;

            margin: 0;
            padding: 0;

            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                     env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }

        /* Keep world-space board and screen-space UI in their designed layout. */
        #unity-game-frame {
            position: relative;
            flex: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        /* ================================
           Unity Canvas
           ================================ */
        #unity-canvas {
            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: #000;

            /* 모바일에서 터치 시
               브라우저 스크롤/확대 방지 */
            touch-action: none;
        }

        /* ================================
           로딩 화면
           ================================ */
        #unity-loading {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;
            font-size: 16px;

            text-align: center;

            z-index: 10;
        }

        #unity-progress-background {
            width: 250px;
            height: 8px;

            margin-top: 12px;

            background: #333;

            border-radius: 4px;

            overflow: hidden;
        }

        #unity-progress-bar {
            width: 0%;
            height: 100%;

            background: white;

            transition: width 0.1s;
        }

        /* ================================
           에러 / 경고 배너
           ================================ */
        #unity-warning {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 20;
        }
    </style>
</head>

<body>

<div id="unity-container">

  <div id="unity-game-frame">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

    <div id="unity-loading">
        <div>Loading...</div>

        <div id="unity-progress-background">
            <div id="unity-progress-bar"></div>
        </div>
    </div>

    <div id="unity-warning"></div>

  </div>
</div>


<script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#unity-loading");
    const progressBar = document.querySelector("#unity-progress-bar");
    const warningBanner = document.querySelector("#unity-warning");


    // =====================================
    // Unity 경고 메시지
    // =====================================

    function unityShowBanner(msg, type) {

        function updateBannerVisibility() {
            warningBanner.style.display =
                warningBanner.children.length
                    ? "block"
                    : "none";
        }

        const div = document.createElement("div");

        div.innerHTML = msg;

        div.style.padding = "10px";
        div.style.textAlign = "center";

        if (type === "error") {
            div.style.background = "red";
            div.style.color = "white";
        }
        else if (type === "warning") {
            div.style.background = "yellow";
            div.style.color = "black";

            setTimeout(function () {
                warningBanner.removeChild(div);
                updateBannerVisibility();
            }, 5000);
        }

        warningBanner.appendChild(div);

        updateBannerVisibility();
    }


    // =====================================
    // Unity Build 파일
    // =====================================

    const buildUrl = "Build";

    const loaderUrl =
        buildUrl + "/증강육목.loader.js?v=b61f6177608c";

    const config = {

        // Fixed reference resolution also keeps pixel-based runtime UI stable.
        matchWebGLToCanvasSize: false,

        arguments: [],

        dataUrl:
            buildUrl + "/증강육목.data.unityweb?v=7614e4c8f7a7",

        frameworkUrl:
            buildUrl + "/증강육목.framework.js.unityweb?v=6285426711e3",


        codeUrl:
            buildUrl + "/증강육목.wasm.unityweb?v=7dd46a929420",



        streamingAssetsUrl:
            "StreamingAssets",

        companyName:
            "DefaultCompany",

        productName:
            "jeunggang",

        productVersion:
            "1.0",

        showBanner:
            unityShowBanner
    };

    const container = document.querySelector("#unity-container");
    const gameFrame = document.querySelector("#unity-game-frame");
    function fitGameViewport() {
        const fullscreen = document.fullscreenElement || document.webkitFullscreenElement;
        const viewport = !fullscreen && window.visualViewport;
        container.style.width = (viewport ? viewport.width : window.innerWidth) + "px";
        container.style.height = (viewport ? viewport.height : window.innerHeight) + "px";
        container.style.left = (viewport ? viewport.offsetLeft : 0) + "px";
        container.style.top = (viewport ? viewport.offsetTop : 0) + "px";
        const style = getComputedStyle(container);
        const width = Math.max(0, container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
        const height = Math.max(0, container.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
        const scale = Math.min(width / 1920, height / 1080);
        gameFrame.style.width = (1920 * scale) + "px";
        gameFrame.style.height = (1080 * scale) + "px";
    }
    let fitPending = false;
    function scheduleViewportFit() {
        if (fitPending) return;
        fitPending = true;
        requestAnimationFrame(() => { fitPending = false; fitGameViewport(); });
    }
    window.addEventListener("resize", scheduleViewportFit);
    window.addEventListener("orientationchange", scheduleViewportFit);
    document.addEventListener("fullscreenchange", scheduleViewportFit);
    document.addEventListener("webkitfullscreenchange", scheduleViewportFit);
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleViewportFit);
        window.visualViewport.addEventListener("scroll", scheduleViewportFit);
    }
    if (typeof ResizeObserver !== "undefined")
        new ResizeObserver(scheduleViewportFit).observe(container);
    fitGameViewport();


    // =====================================
    // 모바일 화면 관련
    // =====================================

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        // Unity가 지나치게 높은 DPI로 렌더링해서
        // 모바일 성능이 박살나는 것을 방지
        config.devicePixelRatio = 1;
    }


    // =====================================
    // Unity Loader 실행
    // =====================================

    const script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {

        createUnityInstance(
            canvas,
            config,

            (progress) => {

                progressBar.style.width =
                    (100 * progress) + "%";
            }

        ).then((unityInstance) => {

            loading.style.display = "none";

        }).catch((message) => {

            alert(message);

        });
    };

    document.body.appendChild(script);


    // =====================================
    // 브라우저 기본 터치 동작 차단
    // =====================================

    document.addEventListener(
        "touchmove",
        function (event) {

            event.preventDefault();

        },
        {
            passive: false
        }
    );

</script>

</body>
</html>
